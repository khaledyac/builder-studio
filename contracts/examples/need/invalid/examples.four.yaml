# The intake collects two or three examples, not more.
contract_version: 1.0.0
problem: Store managers track staff requests in a shared spreadsheet that nobody keeps up to date.
users: Store managers in the Retail domain.
examples:
  - A manager logs a request for extra staff on Saturday.
  - A regional lead sees every open request in their region.
  - A manager closes a request.
  - A manager reopens a request.
data:
  - stores-readonly
access: read
audience: team
out_of_scope:
  - Approving requests in the HR system.
domain: retail
project_type: form-workflow
