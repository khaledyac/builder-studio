[project]
name = "studio-common"
version = "0.1.0"
description = "Logging, settings, telemetry and health helpers shared by every Builder Studio service."
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.165.0",
  "opentelemetry-api>=1.45.2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  "opentelemetry-sdk>=1.45.2",
  "pydantic>=2.14.4",
  "pydantic-settings>=2.16.3",
  "studio-contracts",
]

[tool.uv.sources]
studio-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Namespace package: every lib lives under `studio.*` (ADR 0001).
module-name = "studio.common"
