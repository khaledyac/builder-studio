# Every command, locally and in CI. `task --list` shows them all.
version: "3"

includes:
  web:
    taskfile: ./web/Taskfile.yml
    dir: ./web

vars:
  # Locked versions, with every workspace package installed.
  UV_RUN: uv run --all-packages --locked

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install the Python and web dependencies from the lockfiles
    run: once
    cmds:
      - uv sync --all-packages --locked
      - task: web:install

  setup:
    desc: Install the dependencies and the git hooks (run once after cloning)
    cmds:
      - task: install
      - "{{.UV_RUN}} pre-commit install --install-hooks"

  dev:
    desc: Start the local stack
    cmds:
      - echo "No local stack yet. Step 03 adds it."

  dev-down:
    desc: Stop the local stack
    cmds:
      - echo "No local stack yet. Step 03 adds it."

  fmt:
    desc: Format and auto-fix the Python and web code
    deps: [install]
    cmds:
      - "{{.UV_RUN}} ruff format ."
      - "{{.UV_RUN}} ruff check --fix ."
      - task: web:fmt

  lint:
    desc: Lint and type-check the Python and web code
    deps: [install]
    cmds:
      - "{{.UV_RUN}} ruff check ."
      - "{{.UV_RUN}} ruff format --check ."
      - "{{.UV_RUN}} pyright"
      - task: web:lint

  test:
    desc: Run the Python and web tests
    deps: [install]
    cmds:
      - "{{.UV_RUN}} pytest"
      - task: web:test

  contracts-gen:
    desc: Regenerate the JSON Schemas, OpenAPI and TypeScript types from the Pydantic contracts
    deps: [install]
    vars:
      OUT: '{{.OUT | default "contracts/generated"}}'
      BANNER:
        sh: '{{.UV_RUN}} python -c "from studio.contracts.export import TS_BANNER; print(TS_BANNER)"'
    cmds:
      - rm -rf {{.OUT}}
      - "{{.UV_RUN}} python -m studio.contracts.export {{.OUT}}"
      - >-
        web/node_modules/.bin/json2ts --input {{.OUT}}/schemas --output {{.OUT}}/ts
        --no-additionalProperties --unknownAny --bannerComment "{{.BANNER}}"
      - web/node_modules/.bin/tsc --noEmit --strict {{.OUT}}/ts/*.ts

  contracts-check:
    desc: Check the contract examples, then fail if the generated files drift from the Pydantic models
    deps: [install]
    cmds:
      - "{{.UV_RUN}} pytest contracts/tests/test_examples.py -q"
      - task: contracts-gen
        vars:
          OUT: .task/contracts
      - >-
        diff -r contracts/generated .task/contracts
        || (echo "The generated contract files are out of date: run task contracts-gen and commit the result." && exit 1)

  tf-validate:
    desc: Run fmt, validate and the security scan on the Terraform
    cmds:
      - echo "No Terraform yet. Step 06 adds infra/terraform."

  secrets:
    desc: Check that the secret scanners catch a fake secret, then scan the whole git history
    deps: [install]
    cmds:
      - "{{.UV_RUN}} pytest tests/tooling"
      - "{{.UV_RUN}} pre-commit run gitleaks-history --hook-stage manual"

  audit:
    desc: Check the Python and npm dependencies for known vulnerabilities
    deps: [install]
    set: [pipefail]
    cmds:
      - uv export --all-packages --locked --no-emit-workspace --no-hashes --format requirements.txt --quiet | {{.UV_RUN}} pip-audit --strict --disable-pip --no-deps --requirement /dev/stdin
      - task: web:audit
