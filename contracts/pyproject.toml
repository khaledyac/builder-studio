[project]
name = "studio-contracts"
# The one contracts version (ADR 0002). Code reads it at runtime; regenerate after changing it.
version = "1.0.0"
description = "The shared contracts every Builder Studio service, the workspace and the UI build against."
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.165.0",
  "pydantic>=2.14.4",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "studio.contracts"
