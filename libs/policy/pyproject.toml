[project]
name = "studio-policy"
version = "0.1.0"
description = "Builder Studio policy: the risk tier of an app, as a pure function."
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.14.4",
  "studio-contracts",
]

[tool.uv.sources]
studio-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "studio.policy"
