# Git hooks. `task setup` installs them. CI runs the same checks through `task`.
# Hook repos are pinned to commit SHAs. Keep the two gitleaks versions in step.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # Ruff and ESLint run the versions locked in uv.lock and package-lock.json.
      - id: ruff-check
        name: ruff check
        entry: uv run --all-packages --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --all-packages --locked ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: eslint
        name: eslint
        entry: npm --prefix web run lint
        language: system
        files: ^web/
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false
      - id: terraform-fmt
        name: terraform fmt
        entry: hashicorp/terraform:1.17.2 fmt -recursive
        language: docker_image
        files: \.(tf|tfvars)$
        pass_filenames: false
      # Whole-history scan for `task secrets` and CI. Not run on commit.
      - id: gitleaks-history
        name: gitleaks (whole git history)
        entry: gitleaks git --redact --verbose
        language: golang
        additional_dependencies: [github.com/zricethezav/gitleaks/v8@v8.30.1]
        pass_filenames: false
        always_run: true
        stages: [manual]

  # Scans the staged changes on every commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
